global:
  resolve_timeout: 5m
  # Do NOT hardcode secrets here. Set `SLACK_API_URL` as a secret and inject it into the file or use a templating system.
  slack_api_url: "{{ .Values.SLACK_API_URL }}"

route:
  receiver: 'team-slack'
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - match:
        alertname: 'AICircuitOpen'
      receiver: 'on-call-slack'
      continue: true
    - match_re:
        alertname: 'AI.*|AICircuit.*|ExcessSessionValidationErrors'
      receiver: 'team-slack'

receivers:
  - name: 'team-slack'
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: "[{{ .CommonLabels.alertname }}] {{ .CommonLabels.instance }}"
        text: "{{ range .Alerts }}\n*{{ .Annotations.summary }}*\n{{ .Annotations.description }}\n{{ end }}"

  - name: 'on-call-slack'
    slack_configs:
      - channel: '#on-call'
        send_resolved: true
        title: "[ON-CALL] [{{ .CommonLabels.alertname }}] {{ .CommonLabels.instance }}"
        text: "{{ range .Alerts }}\n*{{ .Annotations.summary }}*\n{{ .Annotations.description }}\n{{ end }}"

# Optional: file-based templates to format messages
templates:
  - 'alertmanager/templates/*.tmpl'
