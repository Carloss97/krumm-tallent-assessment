groups:
  - name: ai-circuit.rules
    rules:
      - alert: AICircuitOpen
        expr: ai_circuit_open == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI circuit open on {{ $labels.instance }}"
          description: "The AI circuit has been open for more than 5 minutes on {{ $labels.instance }}. Check upstream AI provider and recent failures."

      - alert: AICircuitTriggeredRecently
        expr: increase(ai_circuit_triggers_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AI circuit triggered recently on {{ $labels.instance }}"
          description: "AI circuit triggered at least once in the last 10 minutes. Investigate failover and retries."

      - alert: AICircuitHighFailureCount
        expr: ai_circuit_failures > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High recent AI failure count on {{ $labels.instance }}"
          description: "ai_circuit_failures = {{ $value }}; investigate logs and upstream errors."

      - alert: ExcessSessionValidationErrors
        expr: increase(session_validation_errors_total[10m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High rate of invalid session payloads on {{ $labels.instance }}"
          description: "session_validation_errors_total increased by {{ $value }} in the last 10 minutes. Investigate client-side payload issues or API misuse."
