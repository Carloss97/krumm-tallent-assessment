name: Canary Rollout — Smoke & E2E

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  canary-smoke-e2e:
    name: Smoke & E2E (canary)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      ENABLE_HERO_DEMO: 'false'
      HERO_DEMO_PERCENTAGE: '10'
      PORT: '4000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run smoke + E2E tests (canary)
        run: npm run test:e2e
        env:
          VITE_ENABLE_HERO_DEMO: ${{ env.ENABLE_HERO_DEMO }}
          HERO_DEMO_PERCENTAGE: ${{ env.HERO_DEMO_PERCENTAGE }}
          PORT: ${{ env.PORT }}

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts/**
