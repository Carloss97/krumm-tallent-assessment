name: Deploy Dev Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # Override to 'cloudflare' when you want to publish to Cloudflare Pages
  DEPLOY_TARGET: netlify

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy-netlify:
    name: Deploy to Netlify
    needs: build
    if: ${{ env.DEPLOY_TARGET == 'netlify' || secrets.NETLIFY_AUTH_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Netlify (via CLI)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Skipping Netlify deploy: NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID secret not provided.";
            exit 0;
          fi
          npx netlify deploy --prod --dir=dist --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    needs: build
    if: ${{ env.DEPLOY_TARGET == 'cloudflare' || (secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_PROJECT_NAME != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g @cloudflare/wrangler

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "Skipping Cloudflare Pages deploy: CLOUDFLARE_API_TOKEN or CLOUDFLARE_PROJECT_NAME secret not provided.";
            exit 0;
          fi
          # Use npx to ensure a compatible wrangler binary is used in CI
          npx --yes @cloudflare/wrangler pages publish ./dist --project-name "$CLOUDFLARE_PROJECT_NAME" || \
          wrangler pages publish dist --project-name "$CLOUDFLARE_PROJECT_NAME"
