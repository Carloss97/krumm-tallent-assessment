name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run blocking checks (lint, test, build)
        run: npm run ci:verify

  qa_classification_gate:
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run QA simulation (fast preset)
        env:
          CALIBRATION_SOLID_OVERRIDE: 0.533
          QA_SIM_PRESET: fast
          QA_SIM_FAIL_ON_BREACH: 'false'
        run: |
          npm run calibrate:scoring
          node scripts/qaMassSimulation.mjs

      - name: Evaluate QA gate (blocking on main)
        env:
          QA_GATE_FAIL_ON_BREACH: 'true'
        run: node scripts/ciQaGate.mjs

      - name: Upload QA gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-classification-gate
          path: |
            reports/qa/SIMULATION_MULTI_SEED_latest.json
            reports/qa/SIMULATION_MULTI_SEED_latest.md
            data/calibration/latest-calibration.json
            data/calibration/latest-kpis.json

  security_advisory:
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit [advisory]
        run: npm run security:audit

  e2e_advisory:
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Promotion policy: set this job to blocking (remove continue-on-error)
      # when fallback E2E has >= 95% success over 20+ consecutive main runs.
      - name: Run E2E suite (happy path + backend-down fallback) [advisory]
        run: npm run ci:e2e

  quality_load_advisory:
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Promotion policy: set this job to blocking (remove continue-on-error)
      # when quality alerts run with real outcomes for >= 20 consecutive main runs
      # and backend SLO p95 stays <= target with throttle rate within configured max.
      - name: Quality alerts and calibration [advisory]
        run: npm run ci:quality:advisory

      - name: Backend SLO verification [advisory]
        env:
          BACKEND_BASE_URL: http://127.0.0.1:4000
          BACKEND_LOAD_TOTAL: 200
          BACKEND_LOAD_CONCURRENCY: 20
          BACKEND_SLO_P95_MS: 60
          BACKEND_SLO_MAX_THROTTLE_RATE: 0
        run: |
          npm run dev:server > backend.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          for i in {1..30}; do
            if curl -fsS "$BACKEND_BASE_URL/health" > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS "$BACKEND_BASE_URL/health" > /dev/null || (cat backend.log && exit 1)
          npm run load-test:backend
