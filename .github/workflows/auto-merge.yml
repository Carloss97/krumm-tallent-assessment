name: Auto Merge PRs on CI success

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Find PR associated with head SHA
        id: find_pr
        uses: actions/github-script@v6
        with:
          script: |
            const head = `${{ github.event.workflow_run.head_sha }}`;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: head,
            });
            if (!prs || prs.length === 0) {
              return { pr_number: '' };
            }
            return { pr_number: prs[0].number.toString() };

      - name: Merge PR when present
        if: steps.find_pr.outputs.pr_number != ''
        uses: peter-evans/merge-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.find_pr.outputs.pr_number }}
          merge-method: squash
          commit-title: 'Auto-merged by CI workflow (successful checks)'
