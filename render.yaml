services:
  - type: web
    name: krumm-backend
    runtime: node
    plan: free
    
    # Build & Deployment
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    
    # GitHub integration (if using GitHub)
    # GitHub will trigger rebuilds on push
    autoDeploy: true
    
    # Environment
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: JWT_SECRET_KEY
        sync: false
        # User must provide in Render dashboard
      
      - key: PORT
        value: 4000
      
      - key: ALLOWED_ORIGINS
        sync: false
        # Example: https://yourapp.vercel.app,https://www.example.com
      
      - key: GEMINI_API_KEY
        sync: false
      
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      
      - key: DATABASE_URL
        sync: false
        # PostgreSQL connection string from Neon
      
      - key: DB_CLIENT
        value: pg
      
      - key: LOG_LEVEL
        value: info
      
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      
      - key: RATE_LIMIT_GLOBAL_MAX_REQUESTS
        value: 180
      
      - key: RATE_LIMIT_AI_WINDOW_MS
        value: 60000
      
      - key: RATE_LIMIT_AI_MAX_REQUESTS
        value: 20
      
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      
      - key: AI_CIRCUIT_WINDOW_MS
        value: 60000
      
      - key: AI_CIRCUIT_THRESHOLD
        value: 5
      
      - key: AI_CIRCUIT_OPEN_MS
        value: 300000
      
      - key: ENABLE_HERO_DEMO
        value: false
      
      - key: HERO_DEMO_PERCENTAGE
        value: 0
      
      - key: RECRUITER_EMAIL
        sync: false
      
      - key: RECRUITER_PASSWORD
        sync: false
      
      - key: ALLOWED_ORIGINS
        value: https://www.krumm.cl,https://www.krumm.cl:443
    
    # Health check configuration
    healthCheckPath: /health
    healthCheckInterval: 60
    
    # Restart policy
    restartPolicyType: on_failure
    restartPolicyMaxRetries: 3
